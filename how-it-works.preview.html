<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How it works &mdash; Intentube</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --mint:   #e4efe9;   /* section background          */
  --green:  #174b3a;   /* deep green                  */
  --ink:    #0e1a16;   /* stage background            */
  --paper:  #f5f8f6;   /* window / card surfaces      */
  --coral:  #e8826d;   /* click moments only          */
  --line:   #c9ddd3;   /* soft border                 */
  --muted:  #3d4d46;   /* muted text                  */

  --r-card: 16px;
  --r-btn:  999px;
  --max:    1120px;

  --sans:    'Instrument Sans', system-ui, -apple-system, sans-serif;
  --display: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;          /* mobile: no horizontal scroll */
}

button { font: inherit; color: inherit; }

/* ============================================================
   SECTION SHELL
   ============================================================ */
.how-section {
  background: var(--mint);
  padding: clamp(56px, 8vw, 104px) 0 clamp(72px, 9vw, 132px);
}
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

.eyebrow {
  margin: 0 0 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--green);
}
.how-section h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 5.2vw, 58px);
  line-height: 1.03;
  letter-spacing: -.028em;
  max-width: 15ch;
}

/* --- desktop: step list + pinned stage ------------------------ */
.stagegrid {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(0, 1.06fr);
  gap: clamp(32px, 5vw, 76px);
  align-items: center;
  margin-top: clamp(40px, 5.5vw, 76px);
}

/* ============================================================
   STEP LIST  (a real <ol>; the rail encodes how far you are)
   ============================================================ */
.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}
.steps__rail {
  position: absolute;
  left: 15px; top: 30px; bottom: 30px;
  width: 2px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
}
.steps__fill {                 /* scaleY only — never height */
  position: absolute;
  inset: 0;
  background: var(--green);
  transform-origin: top center;
  transform: scaleY(0);
}
.step {
  position: relative;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 13px 0;
  opacity: .35;                 /* inactive steps, per brief */
}
.step.is-on { opacity: 1; }
.step__num {
  flex: none;
  width: 32px; height: 32px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-weight: 700;
  font-size: 14px;
  line-height: 1;
  border: 1.5px solid var(--green);
  color: var(--green);
  background: transparent;
}
.step.is-on .step__num {
  background: var(--green);
  border-color: var(--green);
  color: var(--paper);
}
.step__title {
  margin: 4px 0 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -.018em;
  line-height: 1.2;
}
.step__body {
  margin: 5px 0 0;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--muted);
  max-width: 34ch;
}

/* ============================================================
   STAGE
   role="img" so the mock UI never reaches the a11y tree;
   `inert` on the inner wrapper removes its buttons from the
   tab order without hiding the stage's own label.
   ============================================================ */
.stage {
  position: relative;
  height: clamp(380px, 54vh, 520px);
  background: var(--ink);
  border: 1px solid rgba(201, 221, 211, .16);
  border-radius: var(--r-card);
  box-shadow: 0 28px 64px -30px rgba(10, 19, 16, .62), 0 2px 10px rgba(10, 19, 16, .2);
  overflow: hidden;
}
.stage__inner { position: absolute; inset: 0; }

.scene {
  position: absolute;
  inset: 0;
  padding: clamp(16px, 2.2vw, 28px);
  opacity: 0;
  visibility: hidden;
  cursor: default;             /* the drawn cursor is doing the pointing */
  font-family: var(--sans);
}
.scene.is-static {
  position: relative;
  inset: auto;
  height: 340px;
  opacity: 1;
  visibility: visible;
  border-bottom: 1px solid rgba(201, 221, 211, .12);
}
.stage.is-static { height: auto; overflow: hidden; }
.stage.is-static .stage__inner { position: relative; inset: auto; }

/* ============================================================
   SHARED STAGE FURNITURE
   ============================================================ */

/* browser window */
.win {
  position: absolute;
  inset: clamp(16px, 2.2vw, 28px);
  background: var(--paper);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 44px -24px rgba(0, 0, 0, .72);
}
.win__bar {
  flex: none;
  height: 38px;
  padding: 0 12px;
  background: #e8efeb;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dots { display: flex; gap: 5px; flex: none; }
.dot {
  width: 9px; height: 9px;
  border-radius: 999px;
  background: #c3d2cb;
  font-style: normal;
}
.win__tab {
  flex: none;
  height: 20px;
  max-width: 104px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--paper);
  border: 1px solid var(--line);
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
}
.win__url {
  flex: 1;
  min-width: 0;
  height: 22px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  font-size: 10.5px;
  color: var(--muted);
}
.win__url > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win__menu {
  flex: none;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  color: var(--muted);
  border-radius: 6px;
}
.win__body {
  flex: 1;
  min-height: 0;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 13px;
}

/* text-placeholder bars standing in for page copy */
.ph { height: 8px; border-radius: 4px; background: #d9e3de; }
.ph--t { width: 54%; height: 12px; background: #c6d6ce; }
.ph--s { width: 78%; }
.win__meta { font-size: 10.5px; color: var(--muted); }

/* buttons */
.btn {
  position: relative;
  border: 0;
  border-radius: var(--r-btn);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  padding: 10px 17px;
  white-space: nowrap;
  cursor: default;
}
.btn--coral  { background: var(--coral); color: var(--ink); }
.btn--ghost  { background: var(--paper); color: var(--green); border: 1px solid var(--line); }
.btn--solid  { background: var(--green); color: var(--paper); }

/* coral click pulse — xPercent/yPercent centre it on the button, and GSAP
   keeps them while scale animates */
.ring {
  position: absolute;
  left: 50%; top: 50%;
  width: 100%; height: 100%;
  border-radius: inherit;
  border: 2px solid var(--coral);
  transform-origin: center;
  opacity: 0;
  pointer-events: none;
}

/* chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 11px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  font-size: 10.5px;
  color: var(--ink);
  white-space: nowrap;
}
.chip__ic { width: 9px; height: 9px; border-radius: 2px; background: var(--coral); flex: none; }
.chip__ic--doc { background: #9dbcae; }

/* downloads tray, dropping from the stage's top-right corner.
   No fixed width — it hugs the chip so it never reads as an empty slab. */
.tray {
  position: absolute;
  top: 0; right: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  padding: 11px 14px;
  background: var(--paper);
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-bottom-left-radius: 12px;
  box-shadow: 0 18px 34px -20px rgba(0, 0, 0, .7);
}

/* chrome three-dot menu dropdown */
.menu {
  position: absolute;
  z-index: 4;
  top: 34px; right: 10px;
  width: 148px;
  padding: 5px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 16px 32px -18px rgba(0, 0, 0, .6);
}
.menu__item {
  padding: 7px 9px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--ink);
  white-space: nowrap;
}

/* address-bar caret */
.caret {
  display: inline-block;
  width: 1.5px;
  height: 11px;
  margin-left: 1px;
  background: var(--green);
  vertical-align: -1px;
  animation: blink 1.05s steps(1, end) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* drawn cursor */
.cur {
  position: absolute;
  left: 15%;
  top: 62%;
  z-index: 9;
  pointer-events: none;
  filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .5));
  will-change: transform;
}

/* ============================================================
   SCENE 2 — zip / folder
   ============================================================ */
.zipscene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
/* Both stacks share one centred slot so the label never collides with the
   chips; the zip stack fades out exactly as the folder fades in. */
.zipslot {
  position: relative;
  width: 100%;
  height: 172px;
  display: grid;
  place-items: center;
}
.zipslot > .stack { position: absolute; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 11px; }
.zi { display: block; will-change: transform; }
.zip-h { fill: #dceae3; stroke: var(--green); stroke-width: 2.5; stroke-linejoin: round; }
.ziplabel { font-size: 12px; color: var(--muted); }
.zips { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }

/* ============================================================
   SCENE 4 / 5 — chrome://extensions
   ============================================================ */
.extpage {
  position: absolute;
  inset: clamp(16px, 2.2vw, 28px);
  background: var(--paper);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 44px -24px rgba(0, 0, 0, .72);
}
.extpage__top {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 15px;
  border-bottom: 1px solid var(--line);
}
.extpage__name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 13px;
}
.extlogo { width: 19px; height: 19px; border-radius: 6px; background: var(--coral); flex: none; }
.devrow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }

.toggle {
  display: block;
  width: 38px; height: 21px;
  border-radius: 999px;
  background: #cddad4;
  position: relative;
  flex: none;
}
.toggle__knob {
  position: absolute;
  top: 2.5px; left: 2.5px;
  width: 16px; height: 16px;
  border-radius: 999px;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  will-change: transform;
}

.extpage__body {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--mint);
}
.extbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 15px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  will-change: transform;
}
.extempty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11.5px;
  color: var(--muted);
}

.extcard {
  position: absolute;
  top: 66px; left: 15px; right: 15px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 24px -18px rgba(0, 0, 0, .5);
}
.extcard__name { font-family: var(--display); font-weight: 700; font-size: 13px; }
.extcard__id { font-size: 10px; color: var(--muted); margin-top: 2px; }
.extcard__sp { flex: 1; }
.extcard .toggle { background: var(--green); }
.extcard .toggle__knob { left: auto; right: 2.5px; }

/* folder picker modal */
.bkd {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgba(10, 19, 16, .66);
}
.pickerwrap {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.picker {
  width: min(84%, 350px);
  background: var(--paper);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 34px 64px -24px rgba(0, 0, 0, .82);
  will-change: transform;
}
.picker__title {
  padding: 12px 15px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 12.5px;
  border-bottom: 1px solid var(--line);
}
.picker__path {
  padding: 8px 15px;
  font-size: 10.5px;
  color: var(--muted);
  background: #eef3f0;
}
.picker__rows { padding: 7px; display: flex; flex-direction: column; gap: 3px; }
.picker__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 9px;
  border-radius: 7px;
  border: 1px solid transparent;
  font-size: 11.5px;
  color: var(--ink);
}
.picker__row--dim { color: var(--muted); }
.picker__ic {
  width: 15px; height: 12px;
  border-radius: 3px;
  background: #c3d6cc;
  flex: none;
}
.picker__row.is-hit { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.picker__row.is-hit .picker__ic { background: rgba(14, 26, 22, .35); }
.picker__actions {
  display: flex;
  justify-content: flex-end;
  padding: 11px 13px;
  border-top: 1px solid var(--line);
  background: #eef3f0;
}

/* ============================================================
   SCENE 6 — YouTube
   ============================================================ */
.yt {
  position: absolute;
  inset: clamp(16px, 2.2vw, 28px);
  background: var(--paper);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 44px -24px rgba(0, 0, 0, .72);
}
.yt__bar {
  flex: none;
  height: 40px;
  padding: 0 14px;
  background: #e8efeb;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.yt__search {
  flex: 1;
  max-width: 210px;
  height: 24px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 10.5px;
  color: var(--muted);
}
.yt__sp { flex: 1; }
.yt__ext {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  flex: none;
}
.yt__grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 10px;
  padding: 12px;
}
.vcard { display: flex; flex-direction: column; gap: 5px; min-height: 0; will-change: opacity; }
.vthumb { position: relative; flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; }
.vring {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  border: 2px solid var(--green);
  opacity: 0;
  will-change: transform, opacity;
}
.vtitle { height: 5px; border-radius: 3px; background: #c9d6d0; flex: none; }
.vmeta { height: 5px; width: 52%; border-radius: 3px; background: #e0e8e4; flex: none; }
.vcard.is-dim { filter: grayscale(1); }

/* extension popup */
.popup {
  position: absolute;
  top: 10px; right: 10px;
  z-index: 7;
  width: min(66%, 244px);
  padding: 13px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 24px 46px -18px rgba(0, 0, 0, .78);
  display: flex;
  flex-direction: column;
  gap: 8px;
  will-change: transform, opacity;
}
.popup__title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 12px;
}
.popup__field {
  height: 29px;
  border-radius: 8px;
  border: 1px solid var(--green);
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 9px;
  font-size: 11px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
}
.popup__hint { font-size: 9.5px; color: var(--muted); }

/* final pill */
.donewrap {
  position: absolute;
  left: 0; right: 0; bottom: 20px;
  z-index: 8;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.donepill {
  background: var(--coral);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 700;
  font-size: 12.5px;
  padding: 10px 19px;
  border-radius: var(--r-btn);
  box-shadow: 0 16px 32px -14px rgba(232, 130, 109, .5);
  will-change: transform, opacity;
}

/* ============================================================
   MOBILE — steps stack, each carries its own scene
   ============================================================ */
.msteps {
  list-style: none;
  margin: clamp(32px, 7vw, 48px) 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.mstep__head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.mstep__head .step__title { margin: 3px 0 0; font-size: 18px; }
.mstage {
  position: relative;
  height: clamp(264px, 68vw, 330px);
  background: var(--ink);
  border: 1px solid rgba(201, 221, 211, .16);
  border-radius: var(--r-card);
  box-shadow: 0 20px 44px -26px rgba(10, 19, 16, .6);
  overflow: hidden;
}
.mstage .scene.is-static { height: 100%; border-bottom: 0; }
.mstage__inner { position: absolute; inset: 0; }

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  .step { opacity: 1; }
}
</style>
</head>

<body>
<main>
  <section class="how-section" id="how">
    <div class="wrap">
      <p class="eyebrow">How it works</p>
      <h2>Set up in six steps. Under two minutes.</h2>
      <div data-mount></div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function () {
  'use strict';

  gsap.registerPlugin(ScrollTrigger);

  /* ==========================================================
     0 · HELPERS
     ========================================================== */
  const q  = (root, sel) => root.querySelector(sel);
  const h  = (tag, cls, html) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (html != null) el.innerHTML = html;
    return el;
  };

  /* Unique ids per scene instance — a page can hold 12 of them. */
  let uid = 0;

  const CURSOR =
    '<svg class="cur" width="24" height="28" viewBox="0 0 24 28" aria-hidden="true">' +
      '<path d="M3 2.2V22.4L8.4 17.1L12.1 25.4L16.2 23.6L12.5 15.5L19.8 15.2Z" ' +
            'fill="#0e1a16" stroke="#f5f8f6" stroke-width="1.7" stroke-linejoin="round"/>' +
    '</svg>';

  const FOLDER_PATH =
    'M20 40a9 9 0 0 1 9-9h20l13 13h38a9 9 0 0 1 9 9v44a9 9 0 0 1-9 9H29a9 9 0 0 1-9-9Z';

  const PH = '<div class="ph ph--t"></div><div class="ph ph--s"></div>';

  const LOCK =
    '<svg width="9" height="10" viewBox="0 0 10 10" fill="none" stroke="#3d4d46" ' +
    'stroke-width="1.2" aria-hidden="true"><rect x="2" y="4.5" width="6" height="4.5" rx="1"/>' +
    '<path d="M3.4 4.5V3.2a1.6 1.6 0 0 1 3.2 0v1.3"/></svg>';

  const PUZZLE =
    '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#3d4d46" ' +
    'stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="5" height="5" rx="1.5"/>' +

    { title: 'Open Chrome settings',   body: 'Click the three dots at the top right of Chrome, then Extensions.' },
    { title: 'Enable developer mode',  body: 'Flip the switch in the top right of the extensions page.' },

    { title: 'Open YouTube and use the extension', body: 'Say why you are here. Everything else fades back.' }

  /* Typewriter that survives scrub — a real tweened counter, not a text
     plugin, so seeking the timeline rewinds the string correctly. */
  function typeOut(tl, node, str, at) {
    const state = { i: 0 };
    tl.to(state, {
      i: str.length,
      duration: str.length * 0.04,
      ease: 'none',
      onUpdate() { node.textContent = str.slice(0, Math.round(state.i)); }
    }, at);
  }

  /* Curved cursor travel with no MotionPath plugin: x and y are two
     tweens sharing a duration but running different eases.
     The aim point is the control's CENTRE plus a nudge, so the cursor's
     TIP (its top-left) lands on the button and the body overhangs right,
     the way a real screenshot of a hand on a mouse would read. */
  function makeAim(scene, cur) {
    gsap.set(cur, { x: 0, y: 0 });
    const s = scene.getBoundingClientRect();
    const c = cur.getBoundingClientRect();
    const ox = c.left - s.left, oy = c.top - s.top;
    return function aim(target, dx, dy) {
      const t = target.getBoundingClientRect();
      return {
        x: (t.left - s.left + t.width  / 2 + (dx || 0)) - ox,
        y: (t.top  - s.top  + t.height / 2 + (dy || 0)) - oy
      };
    };
  }
  function glide(tl, cur, aim, target, at, dur, dx, dy) {
    const p = aim(target, dx, dy);
    tl.to(cur, { x: p.x, duration: dur, ease: 'power2.inOut' }, at)
      .to(cur, { y: p.y, duration: dur, ease: 'power3.inOut' }, at);
  }
  function press(tl, cur, btn, at) {
    tl.to(cur,   { scale: .82, duration: .07, ease: 'power2.out' }, at)
      .to(cur,   { scale: 1,   duration: .22, ease: 'power3.out' }, at + .07)
      .to(btn,   { scale: .95, duration: .10, ease: 'power2.out' }, at)
      .to(btn,   { scale: 1,   duration: .26, ease: 'power2.out' }, at + .10);
  }

  /* Scene wrapper crossfade, used only by the animated desktop chain.
     Called after the scene's content is built so the fade-out is anchored to
     the real end of that scene rather than a guessed constant.
     `first` makes the opening scene simply BE visible instead of fading in,
     so the stage is never an empty black box at rest, before any scrolling. */
  function finish(el, tl, o) {
    if (o && o.wrap === false) {
      /* stacked (mobile) or static (reduced motion): the wrapper never fades,
         so it must be painted visible — the CSS default is hidden. */
      gsap.set(el, { autoAlpha: 1 });
      return tl;
    }
    var dur = tl.duration();
    if (o && o.first) {
      tl.set(el, { autoAlpha: 1 }, 0);
    } else {
      tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: .3, ease: 'power2.out' }, 0);
    }
    tl.to(el, { autoAlpha: 0, duration: .3, ease: 'power2.in' }, Math.max(dur, .6));
    return tl;
  }

  function timeline2(el, o) {

      .to(fl, { autoAlpha: 1, duration: .3, ease: 'power2.out' }, 1.50)

      .to(files, { autoAlpha: 1, y: 0, scale: 1, duration: .5, ease: 'back.out(1.7)', stagger: .07 }, 1.78);

  function buildSteps(staticMode) {
    var ol = h('ol', 'steps');
    ol.setAttribute('aria-label', 'Installation steps');

    if (!staticMode) {
      var rail = h('div', 'steps__rail', '<div class="steps__fill"></div>');
      rail.setAttribute('aria-hidden', 'true');
      ol.appendChild(rail);
    }

    STEPS.forEach(function (s, i) {
      var li = h('li', 'step');
      li.innerHTML =
        '<span class="step__num" aria-hidden="true">' + (i + 1) + '</span>' +
        '<div>' +
          '<h3 class="step__title">' + s.title + '</h3>' +
          '<p class="step__body">' + s.body + '</p>' +
        '</div>';
      ol.appendChild(li);
    });
    return ol;
  }

  /* Every scene gets an inert wrapper: the stage carries role="img" and its
     own label, so the mock UI must not be reachable by keyboard or read out. */
  function buildStage(staticMode) {
    var stage = h('div', 'stage' + (staticMode ? ' is-static' : ''));
    stage.setAttribute('role', 'img');
    stage.setAttribute('aria-label', STEPS[0].title + '. ' + STEPS[0].body);

    var inner = h('div', 'stage__inner');
    inner.setAttribute('inert', '');
    stage.appendChild(inner);

    var els = SCENES.map(function (s) {
      var el = s.mount();
      if (staticMode) el.classList.add('is-static');
      inner.appendChild(el);
      return el;
    });
    return { stage: stage, inner: inner, els: els };
  }

  /* ==========================================================
     DESKTOP — pinned, scrubbed, reversible
     ========================================================== */
  function buildDesktop(reduced) {
    var mount = q(document, '[data-mount]');
    mount.innerHTML = '';

    var grid = h('div', 'stagegrid');
    var steps = buildSteps(reduced);
    var st = buildStage(reduced);
    grid.appendChild(steps);
    grid.appendChild(st.stage);
    mount.appendChild(grid);

    var items = Array.prototype.slice.call(steps.querySelectorAll('.step'));
    var fill  = q(steps, '.steps__fill');
    var active = -1;

    function setActive(i) {
      if (i === active) return;
      active = i;
      items.forEach(function (li, n) {
        li.classList.toggle('is-on', n === i);
        if (n === i) li.setAttribute('aria-current', 'step');
        else li.removeAttribute('aria-current');
      });
      st.stage.setAttribute('aria-label', STEPS[i].title + '. ' + STEPS[i].body);
    }

    if (reduced) {
      /* No pin, no scrub: every step legible, every scene at its end state. */
      items.forEach(function (li) {
        li.classList.add('is-on');
        li.setAttribute('aria-current', 'step');
      });
      st.els.forEach(function (el, i) {
        /* wrap:false — nothing crossfades, so the scene must simply be
           painted visible; seeking to the end gives the state scroll reaches. */
        SCENES[i].timeline(el, { wrap: false }).progress(1).pause();
      });
      return;
    }

    setActive(0);

    /* Master timeline: six scenes chained, scrubbed by scroll position. */
    var master = gsap.timeline({
      scrollTrigger: {
        /* Pinned on the grid, not the whole section: the section's header is
           taller than a short laptop viewport, so pinning it would clip the
           stage off the bottom. Same start/end/scrub, honest target. */
        trigger: grid,
        start: 'top 88px',
        end: '+=3000',
        pin: true,
        pinSpacing: true,
        scrub: 0.6,
        onUpdate: function (self) {
          setActive(Math.min(5, Math.floor(self.progress * 6)));
        }
      }
    });

    /* Sequential: .add() with no position appends at the end of the master,
       so the six scenes play one after another rather than all at once. */
    st.els.forEach(function (el, i) {
      master.add(SCENES[i].timeline(el, i === 0 ? { first: true } : undefined));
    });

    /* Rail fill rides the whole chain, transform-only. */
    master.to(fill, {
      scaleY: 1,
      duration: master.duration(),
      ease: 'none'
    }, 0);

    fitPinRange();
    /* Force one render at rest. A scrubbed timeline is left paused until the
       first scroll, so without this the opening scene keeps the hidden state
       its fromTo applied at build time and the stage shows as a black box
       until the user scrolls. */
    master.progress(0);
    ScrollTrigger.refresh();
    return { grid: grid, master: master };
  }

  /* A pinned ScrollTrigger can only be scrubbed as far as the document
     actually scrolls. If this section is the last thing on the page there is
     nothing below it, max scroll lands short of `end`, and the tail of the
     timeline silently stops updating — scenes 5 and 6 would freeze part-way
     and never finish. Pad the section by exactly the shortfall and nothing
     more, so a page with real content below it gets no extra space at all. */
  function fitPinRange() {
    var st = ScrollTrigger.getAll().filter(function (t) { return t.pin; })[0];
    if (!st) return;
    var sec = q(document, '.how-section');
    if (!sec) return;
    sec.style.paddingBottom = '';
    ScrollTrigger.refresh();
    var shortfall = Math.ceil(st.end - (document.documentElement.scrollHeight - window.innerHeight));
    if (shortfall > 0) {
      sec.style.paddingBottom = (shortfall + 48) + 'px';
      ScrollTrigger.refresh();
    }
  }

  /* ==========================================================
     MOBILE — stacked, each scene plays once on entry
     ========================================================== */
  function buildMobile(reduced) {
    var mount = q(document, '[data-mount]');
    mount.innerHTML = '';

    var ol = h('ol', 'msteps');
    ol.setAttribute('aria-label', 'Installation steps');

    STEPS.forEach(function (s, i) {
      var li = h('li', 'mstep');

      var head = h('div', 'mstep__head');
      head.innerHTML =
        '<span class="step__num" aria-hidden="true">' + (i + 1) + '</span>' +
        '<div><h3 class="step__title">' + s.title + '</h3>' +
        '<p class="step__body">' + s.body + '</p></div>';

      var stage = h('div', 'mstage');
      stage.setAttribute('role', 'img');
      stage.setAttribute('aria-label', s.title + '. ' + s.body);
      var inner = h('div', 'mstage__inner');
      inner.setAttribute('inert', '');
      stage.appendChild(inner);

      var el = SCENES[i].mount();
      if (reduced) el.classList.add('is-static');
      inner.appendChild(el);

      li.appendChild(head);
      li.appendChild(stage);
      ol.appendChild(li);
    });

    mount.appendChild(ol);

    if (reduced) {
      ol.querySelectorAll('.mstage').forEach(function (m, i) {
        SCENES[i].timeline(m.querySelector('.scene'), { wrap: false }).progress(1).pause();
      });
      return;
    }

    Array.prototype.forEach.call(ol.querySelectorAll('.mstage'), function (m, i) {
      var tl = SCENES[i].timeline(m.querySelector('.scene'), { wrap: false });
      tl.pause();
      ScrollTrigger.create({
        trigger: m,
        start: 'top 80%',
        once: true,
        onEnter: function () { tl.play(0); }
      });
    });

    ScrollTrigger.refresh();
  }

  /* ==========================================================
     BOOT
     Fonts change text metrics, and the scenes measure element
     positions — so wait for them before the first build.
     ========================================================== */
  function start() {
    var mm = gsap.matchMedia();

    /* Four explicit matching contexts. gsap.matchMedia does NOT invoke a
       conditions-object callback when every condition is false, so the
       conditions form would silently skip mobile entirely. */
    mm.add('(min-width: 1024px) and (prefers-reduced-motion: no-preference)',
      function () { buildDesktop(false); return clearMount; });
    mm.add('(min-width: 1024px) and (prefers-reduced-motion: reduce)',
      function () { buildDesktop(true);  return clearMount; });
    mm.add('(max-width: 1023.98px) and (prefers-reduced-motion: no-preference)',
      function () { buildMobile(false); return clearMount; });
    mm.add('(max-width: 1023.98px) and (prefers-reduced-motion: reduce)',
      function () { buildMobile(true);  return clearMount; });

    /* Cursor aim points are measured in pixels, so a width change invalidates
       them; matchMedia's contexts rebuild on the breakpoint, and this covers
       everything in between. */
    var last = window.innerWidth, timer;
    window.addEventListener('resize', function () {
      if (window.innerWidth === last) return;
      last = window.innerWidth;
      clearTimeout(timer);
      timer = setTimeout(function () { fitPinRange(); ScrollTrigger.refresh(); }, 220);
    });
  }

  function clearMount() {
    q(document, '[data-mount]').innerHTML = '';
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
  } else {
    window.addEventListener('load', start);
  }
})();
</script>
</body>
</html>
